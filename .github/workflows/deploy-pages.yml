name: Deploy GitHub Pages

# Site content is deployed on main pushes. Review collection is NOT started on push.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      require_reviews:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Share one Pages deployment lock with the review-sync publishing job.
concurrency:
  group: autogenie-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this site's main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore this repository's latest reviews
        env:
          REQUIRE_REVIEWS: ${{ inputs.require_reviews }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          # 통신 실패를 브랜치 미생성으로 오인해 오래된 번들로 배포하지 않습니다.
          if git ls-remote --exit-code --heads origin refs/heads/review-data > /tmp/autogenie-review-branch; then
            git fetch --no-tags --depth=1 origin refs/heads/review-data:refs/remotes/origin/review-data
            git show refs/remotes/origin/review-data:data/reviews.json > /tmp/autogenie-site-reviews.json
            mv /tmp/autogenie-site-reviews.json data/reviews.json
            echo 'Loaded this repository review-data branch; main push did not replace reviews.'
          else
            status=$?
            if [ "$status" -ne 2 ] || [ "$REQUIRE_REVIEWS" = 'true' ]; then
              echo 'Could not restore the review archive; stopping deployment to preserve the live website.' >&2
              exit 1
            fi
            echo 'No review-data branch yet: using the bundled reviews.json until the first sync.'
          fi
      - name: Setup Node.js for review snapshot
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviews and embed last known good snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('data/reviews.json', 'utf8'));
          const reviews = payload.reviews;
          if (!Array.isArray(reviews) || reviews.length === 0 || (payload.count !== undefined && payload.count !== reviews.length)) {
            throw new Error('Empty or incomplete review archive: deployment blocked');
          }
          const ids = new Set();
          for (const review of reviews) {
            const id = String(review?.id ?? '');
            if (!id || ids.has(id) || typeof review.title !== 'string' || !review.title.trim() || typeof review.date !== 'string' || !review.date.trim()) {
              throw new Error('Invalid or duplicate review: deployment blocked');
            }
            ids.add(id);
          }
          const html = fs.readFileSync('index.html', 'utf8');
          const marker = /(<script type="application\/json" id="autogenieReviewSnapshot">)[\s\S]*?(<\/script>)/g;
          if ([...html.matchAll(marker)].length !== 1) throw new Error('Missing or duplicate review snapshot marker');
          // JSON 내부의 </script> 등은 HTML 태그로 해석되지 않도록 이스케이프합니다.
          const snapshot = JSON.stringify(payload).replace(/</g, '\\u003c');
          fs.writeFileSync('index.html', html.replace(marker, (_, open, close) => open + snapshot + close), 'utf8');
          console.log(`Embedded ${reviews.length} verified reviews in the same Pages artifact.`);
          NODE
      - name: Exclude repository-only files from published website
        shell: bash
        run: |
          rm -rf .git .github scripts analytics
          rm -f .gitignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
